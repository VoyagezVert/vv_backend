name: Build and Deploy VoyagezVert Backend

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Deploy
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      
      - name: Set up Gradle 9.2.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.2.0"
      
      - name: Read current version
        id: version
        run: |
          CURRENT_VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "Version actuelle : $CURRENT_VERSION"
          echo "CURRENT_VERSION=$CURRENT_VERSION" >> $GITHUB_ENV
      
      - name: Compute new version
        id: bump
        run: |
          CURRENT="${CURRENT_VERSION#v}"
          BASE_VERSION="${CURRENT%-SNAPSHOT}"
          IFS='.' read -ra PARTS <<< "$BASE_VERSION"
          MAJOR=${PARTS[0]:-0}
          MINOR=${PARTS[1]:-0}
          PATCH=${PARTS[2]:-0}
          BRANCH="${GITHUB_REF##*/}"
          SUFFIX=""
          if [[ "$BRANCH" == "prod" ]]; then
            ((MAJOR++))
            MINOR=0
            PATCH=0
            SUFFIX=""
          elif [[ "$BRANCH" == "staging" ]]; then
            ((MINOR++))
            PATCH=0
            SUFFIX="-SNAPSHOT"
          elif [[ "$BRANCH" == "fix/"* || "$BRANCH" == "bugfix/"* ]]; then
            ((PATCH++))
            SUFFIX="-SNAPSHOT"
          else
            ((PATCH++))
            SUFFIX="-SNAPSHOT"
          fi
          NEW_VERSION="v${MAJOR}.${MINOR}.${PATCH}${SUFFIX}"
          echo "Nouvelle version : $NEW_VERSION"
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV
      
      - name: Update .version file
        run: |
          echo "${NEW_VERSION#v}" > .version
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .version
          git commit -m "chore: bump version to ${NEW_VERSION#v}" || echo "Aucune modification à committer"
          git push origin "${GITHUB_REF##*/}"
      
      - name: Build with Gradle
        run: gradle clean build
        env:
          PROJECT_VERSION: ${{ env.NEW_VERSION }}
      
      - name: Create and push tag
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          if git rev-parse "${NEW_VERSION}" >/dev/null 2>&1; then
            echo "⚠️ Tag ${NEW_VERSION} existe déjà, on le saute."
          else
            git tag -a "${NEW_VERSION}" -m "Auto release ${NEW_VERSION}"
            git push origin "${NEW_VERSION}"
            echo "🏷️ Nouveau tag créé : ${NEW_VERSION}"
          fi
      
      - name: Deploy (placeholder)
        run: echo "🚀 Déploiement de la version $NEW_VERSION"
