name: Build and Deploy VoyagezVert Backend

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    name: Build & Deploy
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}
      
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      
      - name: Set up Gradle 9.2.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.2.0"
      
      - name: Read current version
        id: version
        run: |
          CURRENT_VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "Version actuelle : $CURRENT_VERSION"
          echo "CURRENT_VERSION=$CURRENT_VERSION" >> $GITHUB_ENV
      
      - name: Compute new version
        id: bump
        run: |
          set -x
          echo "DEBUG: CURRENT_VERSION=${CURRENT_VERSION}"
          VERSION_WITHOUT_V="${CURRENT_VERSION#v}"
          echo "DEBUG: VERSION_WITHOUT_V=${VERSION_WITHOUT_V}"
          BASE="${VERSION_WITHOUT_V%-SNAPSHOT}"
          echo "DEBUG: BASE=${BASE}"
          
          IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE"
          MAJOR=${MAJOR:-0}
          MINOR=${MINOR:-0}
          PATCH=${PATCH:-0}
          
          echo "DEBUG: MAJOR=$MAJOR MINOR=$MINOR PATCH=$PATCH"
          
          BRANCH="${GITHUB_REF#refs/heads/}"
          echo "DEBUG: BRANCH=${BRANCH}"
          echo "BRANCH_NAME=$BRANCH" >> $GITHUB_ENV
          
          SUFFIX=""
          
          if [[ "$BRANCH" == "prod" ]]; then
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0
            SUFFIX=""
          elif [[ "$BRANCH" == "staging" ]]; then
            MINOR=$((MINOR + 1))
            PATCH=0
            SUFFIX="-SNAPSHOT"
          elif [[ "$BRANCH" == fix/* ]] || [[ "$BRANCH" == bugfix/* ]] || [[ "$BRANCH" == bug/* ]]; then
            PATCH=$((PATCH + 1))
            SUFFIX="-SNAPSHOT"
          else
            PATCH=$((PATCH + 1))
            SUFFIX="-SNAPSHOT"
          fi
          
          NEW_VERSION="v${MAJOR}.${MINOR}.${PATCH}${SUFFIX}"
          echo "Nouvelle version : $NEW_VERSION"
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV
      
      - name: Update .version file
        run: |
          echo "${NEW_VERSION#v}" > .version
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .version
          git commit -m "chore: bump version to ${NEW_VERSION#v}" || echo "Aucune modification à committer"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ env.BRANCH_NAME }}
      
      - name: Build with Gradle
        run: gradle clean build
        env:
          PROJECT_VERSION: ${{ env.NEW_VERSION }}
      
      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git rev-parse "${NEW_VERSION}" >/dev/null 2>&1; then
            echo "⚠️ Tag ${NEW_VERSION} existe déjà, on le saute."
          else
            git tag -a "${NEW_VERSION}" -m "Auto release ${NEW_VERSION}"
            git push origin "${NEW_VERSION}"
            echo "🏷️ Nouveau tag créé : ${NEW_VERSION}"
          fi
      
      - name: Deploy (placeholder)
        run: echo "🚀 Déploiement de la version $NEW_VERSION"
