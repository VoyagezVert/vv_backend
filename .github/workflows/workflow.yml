name: Build and Deploy VoyagezVert Backend

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write  # nécessaire pour créer des tags

jobs:
  build:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2️⃣ Setup Java + Gradle
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle 9.2.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.2.0"

      # 3️⃣ Lire la version actuelle
      - name: Read current version
        id: version
        run: |
          CURRENT_VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "Version actuelle : $CURRENT_VERSION"
          echo "CURRENT_VERSION=$CURRENT_VERSION" >> $GITHUB_ENV

      # 4️⃣ Calculer la nouvelle version
      - name: Compute new version
        id: bump
        run: |
          CURRENT="${CURRENT_VERSION#v}" # retire le v
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"

          if [[ "${GITHUB_REF##*/}" == "prod" ]]; then
            ((MAJOR++))
            MINOR=0
            PATCH=0
            SUFFIX=""
          elif [[ "${GITHUB_REF##*/}" == "staging" ]]; then
            ((MINOR++))
            PATCH=0
            SUFFIX="-SNAPSHOT"
          elif [[ "${GITHUB_REF##*/}" == fix/* || "${GITHUB_REF##*/}" == bugfix/* ]]; then
            ((PATCH++))
            SUFFIX="-SNAPSHOT"
          else
            SUFFIX="-SNAPSHOT"
          fi

          NEW_VERSION="v${MAJOR}.${MINOR}.${PATCH}${SUFFIX}"
          echo "Nouvelle version : $NEW_VERSION"
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV

      # 5️⃣ Build
      - name: Build with Gradle
        run: gradle clean build
        env:
          PROJECT_VERSION: ${{ env.NEW_VERSION }}

      # 6️⃣ Créer le tag auto
      - name: Create and push new tag
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          # Si le tag existe déjà, on ne le re-crée pas
          if git rev-parse "${NEW_VERSION}" >/dev/null 2>&1; then
            echo "⚠️ Tag ${NEW_VERSION} existe déjà, skip."
          else
            git tag -a "${NEW_VERSION}" -m "Auto release ${NEW_VERSION}"
            git push origin "${NEW_VERSION}"
            echo "🏷️ Nouveau tag créé : ${NEW_VERSION}"
          fi

      # 7️⃣ Placeholder de déploiement
      - name: Deploy (placeholder)
        run: echo "🚀 Déploiement de la version $NEW_VERSION"
