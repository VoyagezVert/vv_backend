spring.application.name=vv_backend
spring.datasource.url=${DB_URL:jdbc:postgresql://vv_db:5432/vv_db}
spring.datasource.username=${DB_USER:voyagezvert}
spring.datasource.password=${DB_PASSWORD:voyagezvert}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.url=/openapi/openapi.yaml
spring.resources.static-locations=classpath:/openapi/
